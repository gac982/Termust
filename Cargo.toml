[workspace]
resolver = "2"
members = [
  "app",
  "crates/core",
  "crates/text-render",
  "crates/render-cairo",
  "crates/render-gl",
  "crates/term-engine",
  "crates/pty-unix",
  "crates/fs-local",
  "crates/git-local",
  "crates/git-remote",
  "crates/vault",
  "crates/store",
  "crates/host-exec",
  "crates/host-pty",
  "crates/agents",
  "crates/syntax",
  "crates/ui",
  "crates/i18n",
  "crates/conformance",
]

[workspace.package]
version = "1.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.92"  # MSRV; el toolchain local se pinea en rust-toolchain.toml

[workspace.dependencies]
termust-core = { path = "crates/core" }
termust-text-render = { path = "crates/text-render" }
termust-render-cairo = { path = "crates/render-cairo" }
termust-render-gl = { path = "crates/render-gl" }
termust-term-engine = { path = "crates/term-engine" }
termust-pty-unix = { path = "crates/pty-unix" }
termust-fs-local = { path = "crates/fs-local" }
termust-git-local = { path = "crates/git-local" }
termust-git-remote = { path = "crates/git-remote" }
termust-vault = { path = "crates/vault" }
termust-store = { path = "crates/store" }
termust-host-exec = { path = "crates/host-exec" }
termust-agents = { path = "crates/agents" }
termust-syntax = { path = "crates/syntax" }
termust-ui = { path = "crates/ui" }
termust-i18n = { path = "crates/i18n" }
gtk4 = { version = "0.11.5", features = ["v4_10"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
alacritty_terminal = "0.26.0"
cairo-rs = "0.22"
libc = "0.2"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-php = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-astro-next = "0.1.1"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-md = "0.5.4"
streaming-iterator = "0.1"
pango = "0.22"
pangocairo = "0.22"
mio = { version = "1", features = ["os-poll", "os-ext"] }
serde_json = "1"
regex = "1"
gettext-rs = "0.8"
toml = "1.2"
rusqlite = { version = "0.43", features = ["bundled"] }
chacha20poly1305 = "0.11"
argon2 = "0.6"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
